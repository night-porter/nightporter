# Release config for cargo-dist (https://opensource.axo.dev/cargo-dist/).
# Generate/refresh the release workflow with: `dist generate` (writes .github/workflows/release.yml)
[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.34.0"
ci = "github"
installers = ["shell", "powershell", "homebrew"]
tap = "night-porter/homebrew-tap"
publish-jobs = ["homebrew"]  # crates.io: hand-written `publish-crates` job in release.yml
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-unknown-linux-musl",
  "x86_64-unknown-linux-musl",
  "x86_64-pc-windows-msvc",
]
install-path = "CARGO_HOME"
install-updater = false
pr-run-mode = "plan"
# release.yml is hand-pinned (actions by SHA, verified dist download); keep `dist` from rejecting it.
allow-dirty = ["ci"]
