[package]
name = "nightporter"
version = "0.4.3"
edition = "2024"
rust-version = "1.89"
description = "Handles your PRs while you're away: an agentic night shift for GitHub and GitLab"
license = "MIT OR Apache-2.0"
repository = "https://github.com/night-porter/nightporter"
homepage = "https://night-porter.com"
documentation = "https://docs.night-porter.com"
readme = "README.md"
keywords = ["github", "gitlab", "agent", "tui", "pull-request"]
categories = ["command-line-utilities", "development-tools"]
# Only what the crate needs: prompts/ and assets/ are compiled in with include_str!.
include = ["/src/**", "/prompts/**", "/assets/**", "/LICENSE-*", "/README.md"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
etcetera = "0.11.0"
globset = "0.4.21"
inquire = { version = "0.9.4", default-features = false, features = ["crossterm"] }
jiff = "0.2.39"
keyring = "4.2.0"
notify = "8.2.1"
notify-rust = "4.18.2"
ratatui = "0.30.2"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "http2", "query", "system-proxy"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "process", "time", "sync", "signal", "fs", "io-util"] }
toml = "1.2.0"
toml_edit = "0.25.18"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1

# Release builds made by cargo-dist (see dist-workspace.toml).
[profile.dist]
inherits = "release"

# CI runs clippy with -D warnings, so these are enforced.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
