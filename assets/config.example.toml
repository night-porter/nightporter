# Night Porter config. Per-repo overrides live in repos/<forge>/<owner>/<repo>.toml
# and can set anything from [defaults] (plus `subscribed = true`).
version = 1

# Where your clones live. Scanned up to `scan_depth` levels deep.
code_dir = "~/coding"
scan_depth = 3

poll_interval = "2m"     # never faster than the forge allows
sweep_interval = "10m"   # open-PR sweep for merge conflicts / CI
min_free_gb = 5          # don't create worktrees below this
max_concurrent_jobs = 2
daily_job_cap = 50
retention_days = 30
worktree_idle_days = 14

# Forge accounts. `token = "cli"` asks gh/glab each time; "keyring" uses a PAT stored with
# `nightporter token set <forge> [host]`.
[[accounts]]
forge = "github"

# [[accounts]]
# forge = "gitlab"
# host = "git.drupalcode.org"
# token = "keyring"

[notifications]
needs_approval = true
failed = true
done = true
new_author = true

[defaults]
agent = "claude"            # claude | opencode
level = "draft"             # observe | suggest | draft | auto
triggers = ["review_comment", "review", "comment", "ci_failure", "merge_conflict"]
debounce = "2m"
max_ci_attempts = 3
# CI-failure jobs stop at draft unless you set this (CI output is untrusted text).
# ci_auto = false
timeout = "30m"
# max_budget_usd = 2.0      # Claude Code only
sandbox = true              # Claude Code OS sandbox for agent commands; fails closed
# sandbox_domains = []      # domains sandboxed commands may reach
# allow_commands = ["npm test", "cargo test"]

[defaults.trust]
roles = ["owner", "maintainer", "member", "collaborator"]
allow_users = []
deny_users = []
allow_teams = []            # "org/team" (GitHub) or "group" (GitLab)
allow_bots = []             # e.g. "coderabbitai[bot]"

# Active windows. No [[defaults.schedule]] entries = always active.
# [[defaults.schedule]]
# days = "mon-fri"
# windows = ["08:00-09:00", "11:00-13:00", "17:00-22:00"]

[defaults.reply]
style = "concise"           # concise | detailed-tech-lead | non-technical | path/to/style.md
language = "en"
footer = true               # "— via Night Porter (Claude Code)"
resolve_threads = false

[defaults.checks]
protected = []              # added to the built-in list
escalate_on = ["deps", "size"]
max_diff_lines = 500

[defaults.maintainer]
enabled = false
level = "draft"             # capped at draft
label = "nightporter"
